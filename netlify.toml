# Netlify Configuration for Disaster Relief Fund Management
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Base directory where the frontend application lives
  base = "frontend"

  # Directory that contains the deploy-ready files after build
  publish = "dist"

  # Command to run build
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Single Page Application (SPA) routing: redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets with long max-age
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
